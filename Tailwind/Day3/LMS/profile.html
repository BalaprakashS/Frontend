<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - LMS Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">

        <div class="container">

            <a class="navbar-brand fw-bold" href="#">
                LMS Dashboard
            </a>

            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="courses.html">
                            Courses
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="profile.html">
                            Profile
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- Profile Section -->
    <div class="container py-5">

        <div class="row g-4">

            <!-- Profile Card -->
            <div class="col-lg-4">

                <div class="card shadow-lg rounded-4 hover:-translate-y-2 hover:shadow-2xl transition-all duration-300">

                    <div class="card-body text-center p-5">

                        <img
                            src="../../assets/image/day3img/profile2.png"
                            class="rounded-circle shadow-lg mb-3 object-cover mx-auto"
                            width="150"
                            height="150"
                            alt="Profile">

                        <h3 class="fw-bold">
                            Bala Prakash
                        </h3>

                        <p class="text-muted">
                            Full Stack Developer
                        </p>

                        <hr>

                        <div class="text-start">

                            <p>
                                <strong>Email:</strong>
                                bala@gmail.com
                            </p>

                            <p>
                                <strong>Phone:</strong>
                                +91 9876543210
                            </p>

                            <p>
                                <strong>Course:</strong>
                                Full Stack Development
                            </p>

                            <p>
                                <strong>Location:</strong>
                                Chennai
                            </p>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Edit Form -->
            <div class="col-lg-8">

                <div class="card shadow-lg rounded-4">

                    <div class="card-body p-4">

                        <h2 class="fw-bold mb-4">
                            Edit Profile
                        </h2>

                        <form>

                            <div class="row g-3">

                                <div class="col-md-6">

                                    <label class="form-label">
                                        First Name
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        value="Bala">

                                </div>

                                <div class="col-md-6">

                                    <label class="form-label">
                                        Last Name
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        value="Prakash">

                                </div>

                                <div class="col-md-6">

                                    <label class="form-label">
                                        Email
                                    </label>

                                    <input
                                        type="email"
                                        class="form-control"
                                        value="bala@gmail.com">

                                </div>

                                <div class="col-md-6">

                                    <label class="form-label">
                                        Phone
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        value="+91 9876543210">

                                </div>

                                <div class="col-md-6">

                                    <label class="form-label">
                                        Course
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        value="Full Stack Development">

                                </div>

                                <div class="col-md-6">

                                    <label class="form-label">
                                        City
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        value="Chennai">

                                </div>

                                <div class="col-12">

                                    <label class="form-label">
                                        About Me
                                    </label>

                                    <textarea
                                        rows="5"
                                        class="form-control">Passionate Full Stack Developer with experience in HTML, CSS, JavaScript, Bootstrap, Tailwind CSS and React.</textarea>

                                </div>

                                <div class="col-12">

                                    <label class="form-label">
                                        Upload Profile Photo
                                    </label>

                                    <input
                                        type="file"
                                        class="form-control">

                                </div>

                            </div>

                            <button
                                type="submit"
                                class="btn btn-success mt-4 px-5">

                                Save Changes

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

        <!-- Skills Section -->
        <div class="card shadow-lg rounded-4 mt-5">

            <div class="card-body">

                <h3 class="fw-bold mb-3">
                    Skills
                </h3>

                <div class="flex flex-wrap gap-3">

                    <span class="badge bg-primary p-2">
                        HTML
                    </span>

                    <span class="badge bg-success p-2">
                        CSS
                    </span>

                    <span class="badge bg-warning text-dark p-2">
                        JavaScript
                    </span>

                    <span class="badge bg-info p-2">
                        Bootstrap
                    </span>

                    <span class="badge bg-danger p-2">
                        Tailwind CSS
                    </span>

                    <span class="badge bg-secondary p-2">
                        React
                    </span>

                    <span class="badge bg-dark p-2">
                        Node.js
                    </span>

                    <span class="badge bg-primary p-2">
                        MongoDB
                    </span>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
