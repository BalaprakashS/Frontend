<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid And Animation</title>
    <link rel="stylesheet" href="../assets/css/grid&animation.css">
</head>
<body>
    
    <div>
        <h2>Card Design</h2>

        <div class="card-container">

            <div class="card">
            <img src="../assets/images/animation/11.png">
            <h3>Card One</h3>
            <p>Simple hover zoom effect.</p>
            <button class="btn">Read More</button>
            </div>

            <div class="card">
            <img src="../assets/images/animation/12.png">
            <h3>Card Two</h3>
            <p>Grid card design.</p>
            <button class="btn">Read More</button>
            </div>

            <div class="card">
            <img src="../assets/images/animation/13.png">
            <h3>Card Three</h3>
            <p>Scale animation using hover.</p>
            <button class="btn">Read More</button>
            </div>

        </div>

        <!-- PROFILE CARD -->

        <h2>Profile Card</h2>

        <div class="profile-card">

            <img src="../assets/images/animation/profile2.png" alt="profile">

            <h3>Bala</h3>

            <p>Frontend Developer</p>

        </div>

        <!-- IMAGE GALLERY -->

        <h2>Image Gallery</h2>

        <div class="gallery">

            <div class="gallery-box">
            <img src="../assets/images/animation/1.png">
            </div>

            <div class="gallery-box">
            <img src="../assets/images/animation/2.png">
            </div>

            <div class="gallery-box">
            <img src="../assets/images/animation/3.png">
            </div>

            <div class="gallery-box">
            <img src="../assets/images/animation/4.png">
            </div>

            <div class="gallery-box">
            <img src="../assets/images/animation/5.png"">
            </div>

            <div class="gallery-box">
            <img src="../assets/images/animation/6.png"">
            </div>

        </div>

        <!-- DASHBOARD -->

        <h2>Dashboard Cards</h2>

        <div class="dashboard">

            <div class="dash-card">
            <h3>Users</h3>
            <p>1200 Active Users</p>
            <button class="dash-btn">View</button>
            </div>

            <div class="dash-card">
            <h3>Sales</h3>
            <p>₹50,000 Revenue</p>
            <button class="dash-btn">View</button>
            </div>

            <div class="dash-card">
            <h3>Orders</h3>
            <p>320 New Orders</p>
            <button class="dash-btn">View</button>
            </div>

            <div class="dash-card">
            <h3>Profit</h3>
            <p>₹15,000 Profit</p>
            <button class="dash-btn">View</button>
            </div>

        </div>
    </div>

</body>
</html>
