<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Design</title>
    <link rel="stylesheet" href="../assets/css/cardcreation.css">
</head>

<body>

    <div class="container">
        <h3>Thumbnail</h3>
        <div class="thumbnail">
        <div class="image">
            <img src="../assets/images/thumbnail/sla.png" alt="upload icon" width="300px" height="200px">
        </div>

        <div class="content">
            
            <p><b>Note:</b> This image tile will be used to represent this course across all your academy's landing pages.</p>
            <p>Allowed formats: .jpg, .png, .jpeg, .gif, .webp</p>
            <p>Preferred minimum resolution: 480x270</p>
            <p>Maximum size: 150kb</p>
            <button class="button">Add Image</button>

        </div>
        </div>
    </div>
    
</body>
</html>
