<script>
    let studentName = "John";
    console.log(typeof studentName, studentName);

    let age = 25;
    console.log(typeof age, age);

    let isEnrolled = true;
    console.log(typeof isEnrolled, isEnrolled);

    let courses = ["Math", "Science", "History"];
    console.log(typeof courses, courses);

    let address = {
        street: "123 Main St",
        city: "Anytown",
        zip: "12345"
    };
    console.log(typeof address, address);

    let nullValue = null;
    console.log(typeof nullValue, nullValue);

    let undefinedValue;
    console.log(typeof undefinedValue, undefinedValue); 
</script>
