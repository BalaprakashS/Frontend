<script>

    // Task 1 – Push & Pop (Movie List)

    let movies = ["GOAT", "Leo", "Master"];

    movies.push("Ghilli");
    movies.pop();

    console.log("Task 1 Final Movies:", movies);


    // Task 2 – Shift & Unshift (Hero List)

    let heroes = ["Ajith", "Suriya", "SK"];

    heroes.unshift("Vijay");
    heroes.shift();

    console.log("Task 2 Final Heroes:", heroes);


    // Task 3 – Fruits Management

    let fruits = ["Apple", "Mango", "Orange"];

    fruits.push("Banana");
    fruits.push("Grapes");

    fruits.pop();

    fruits.unshift("Pineapple");

    fruits.shift();

    console.log("Task 3 Final Fruits:", fruits);


    // Task 4 – Student Object

    let student = {
    name: "Sudhan",
    course: "MERN",
    city: "Chennai"
    };

    // Dot Notation
    console.log("Dot Notation");
    console.log("Student Name:", student.name);
    console.log("Course:", student.course);
    console.log("City:", student.city);

    // Bracket Notation
    console.log("Bracket Notation");
    console.log("Student Name:", student["name"]);
    console.log("Course:", student["course"]);
    console.log("City:", student["city"]);


    // Task 5 – Mobile Store (Array of Objects)

    let mobiles = [
    {
        brand: "Samsung",
        price: 20000
    },
    {
        brand: "iPhone",
        price: 80000
    },
    {
        brand: "OnePlus",
        price: 35000
    }
    ];

    console.log("Mobile Store Report");

    for (let i = 0; i < mobiles.length; i++) {
    console.log(mobiles[i].brand + " - " + mobiles[i].price);
    }


    // Task 6 – Movie Collection Report

    let collections = [
    {
        movie: "GOAT",
        collection: 800
    },
    {
        movie: "Leo",
        collection: 600
    },
    {
        movie: "Master",
        collection: 500
    }
    ];

    let totalCollection = 0;
    let highestCollection = collections[0].collection;
    let highestMovie = collections[0].movie;

    for (let i = 0; i < collections.length; i++) {
    totalCollection += collections[i].collection;

    if (collections[i].collection > highestCollection) {
        highestCollection = collections[i].collection;
        highestMovie = collections[i].movie;
    }
    }

    console.log("Total Collection:", totalCollection);
    console.log("Highest Collection:", highestCollection);
    console.log("Movie with Highest Collection:", highestMovie);

</script>
