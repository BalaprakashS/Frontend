<script>

    //Primitive Data Types
    // String
    let name = "bala"
    console.log("name:",name);

    // Number
    let age = "21"
    console.log("age:",age);

    // Boolean
    let isstudent = "true"
    console.log(isstudent);

    // Undefined
    let city
    console.log(city);

    // Null
    let data = "null"
    console.log(data);
        
    //non-primitive data types
    //array
    let mark = [100,90,70]
    console.log("mark:",mark);  
    
    //function
    function greet() {
        console.log("hello");
        
    }
   greet()

   //object
   let student = {
    name : "bala",
    age : "21"
   };
   console.log("name:",student.name);
   console.log("age:",student.age);

   //nested object
   let car = {
    brand : "bmw",
    specs : {
        model : "x5"
    }
   }
   console.log(car.specs.model);

   //array of object
   let students = [
    { name: "Bala", age: 21 },
    { name: "prakash", age: 21 },
    { name: "pradep", age: 22 }
    ];
    console.log(students);
   
   
</script>
